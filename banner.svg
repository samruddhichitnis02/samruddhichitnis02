<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Samruddhi Chitnis, Inference and ML Systems Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#151b23"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76b900" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#76b900" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="14" fill="url(#grid)"/>
  <rect x="64" y="58" width="4" height="74" rx="2" fill="#76b900"/>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="88" y="98" fill="#f0f6fc" font-size="44" font-weight="700" letter-spacing="0.5">Samruddhi Chitnis</text>
    <text x="90" y="130" fill="#8b949e" font-size="20" letter-spacing="0.3">Inference &amp; ML Systems Engineer  ·  CUDA  ·  Triton  ·  vLLM  ·  TensorRT</text>

    <rect x="64" y="176" width="1072" height="1" fill="url(#glow)"/>

    <g>
      <text x="64" y="244" fill="#76b900" font-size="48" font-weight="700">6.3K</text>
      <text x="64" y="274" fill="#c9d1d9" font-size="16">tokens/s served from</text>
      <text x="64" y="296" fill="#c9d1d9" font-size="16">one RTX 4090 (vLLM)</text>
    </g>
    <g>
      <text x="340" y="244" fill="#76b900" font-size="48" font-weight="700">66%</text>
      <text x="340" y="274" fill="#c9d1d9" font-size="16">of cuBLAS with a GEMM</text>
      <text x="340" y="296" fill="#c9d1d9" font-size="16">kernel written from scratch</text>
    </g>
    <g>
      <text x="616" y="244" fill="#76b900" font-size="48" font-weight="700">12→64%</text>
      <text x="616" y="274" fill="#c9d1d9" font-size="16">MFU with custom Triton /</text>
      <text x="616" y="296" fill="#c9d1d9" font-size="16">CUDA kernels and FP8</text>
    </g>
    <g>
      <text x="892" y="244" fill="#76b900" font-size="48" font-weight="700">5</text>
      <text x="892" y="274" fill="#c9d1d9" font-size="16">KV-cache compression methods</text>
      <text x="892" y="296" fill="#c9d1d9" font-size="16">compared on Llama-3.1-8B</text>
    </g>
  </g>
</svg>
